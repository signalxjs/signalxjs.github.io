name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so package versions track npm `latest` without a push.
  schedule:
    - cron: '0 6 * * *'

# Allow only one concurrent deployment, skip runs queued between the run
# in-progress and latest queued. Don't cancel in-progress, so deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Refresh src/lib/versions.generated.ts from npm `latest` so the built
      # site shows current versions. Failure-tolerant: a flaky npm keeps the
      # committed values rather than breaking the deploy.
      - name: Refresh versions from npm
        run: node scripts/fetch-versions.mjs

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
