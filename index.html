<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- Page meta first by design — rationale in ssg.config.ts. -->
    <!--head-tags-->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/sigx.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Theme init runs before render to prevent flash. -->
    <script>
        (function() {
            var theme = localStorage.getItem('daisy-theme');
            if (!theme && window.matchMedia('(prefers-color-scheme: light)').matches) {
                theme = 'light';
            }
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <!-- SITE-wide JSON-LD only — before editing, see the note in ssg.config.ts. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://sigx.dev/#organization",
                "name": "SignalX",
                "url": "https://sigx.dev",
                "logo": "https://sigx.dev/sigx.png",
                "sameAs": ["https://github.com/signalxjs"]
            },
            {
                "@type": "WebSite",
                "@id": "https://sigx.dev/#website",
                "name": "SignalX",
                "url": "https://sigx.dev",
                "description": "SignalX (sigx) — a fine-grained reactive TypeScript framework: signals, TSX components, server functions and actors. Web, native and terminal.",
                "publisher": { "@id": "https://sigx.dev/#organization" },
                "inLanguage": "en"
            },
            {
                "@type": "SoftwareSourceCode",
                "@id": "https://sigx.dev/#software",
                "name": "SignalX",
                "description": "SignalX (sigx) — a fine-grained reactive TypeScript framework: signals, TSX components, server functions and actors. Web, native and terminal.",
                "keywords": "reactive framework, signals, TypeScript, TSX, fine-grained reactivity, SSR, server functions, actors, terminal UI, Lynx, JavaScript framework",
                "url": "https://sigx.dev",
                "codeRepository": "https://github.com/signalxjs/core",
                "programmingLanguage": "TypeScript",
                "runtimePlatform": ["Node.js", "Browser"],
                "license": "https://opensource.org/licenses/MIT",
                "author": { "@id": "https://sigx.dev/#organization" }
            }
        ]
    }

</head>

    <div id="app"><!--app-html--></div>
    <script type="module" src="/@ssg/client.tsx"></script>
</body>
</html>
