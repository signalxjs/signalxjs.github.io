<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/x-icon" href="/sigx.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Theme init runs before render to prevent flash. -->
    <script>
        (function() {
            var theme = localStorage.getItem('daisy-theme');
            if (!theme && window.matchMedia('(prefers-color-scheme: light)').matches) {
                theme = 'light';
            }
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <!--
      Site-wide structured data. This block is static and shared by every
      route, so it describes the SITE and the PROJECT only — per-page schema
      (TechArticle, BreadcrumbList) belongs in the page head, not here.

      No WebSite.potentialAction/SearchAction: there is no on-site search
      endpoint yet, and claiming one Google cannot use is worse than omitting it.
    -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://sigx.dev/#organization",
                "name": "SignalX",
                "url": "https://sigx.dev",
                "logo": "https://sigx.dev/sigx.png",
                "sameAs": ["https://github.com/signalxjs"]
            },
            {
                "@type": "WebSite",
                "@id": "https://sigx.dev/#website",
                "name": "SignalX",
                "url": "https://sigx.dev",
                "description": "A lightweight reactive component framework",
                "publisher": { "@id": "https://sigx.dev/#organization" },
                "inLanguage": "en"
            },
            {
                "@type": "SoftwareSourceCode",
                "@id": "https://sigx.dev/#software",
                "name": "SignalX",
                "description": "Fine-grained reactivity with signals and effects, plus a tiny TSX component runtime — one framework for web, native and terminal.",
                "url": "https://sigx.dev",
                "codeRepository": "https://github.com/signalxjs/core",
                "programmingLanguage": "TypeScript",
                "runtimePlatform": ["Node.js", "Browser"],
                "license": "https://opensource.org/licenses/MIT",
                "author": { "@id": "https://sigx.dev/#organization" }
            }
        ]
    }
    </script>
    <!--head-tags-->
</head>
<body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/@ssg/client.tsx"></script>
</body>
</html>
