<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/x-icon" href="/sigx.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Theme init runs before render to prevent flash. -->
    <script>
        (function() {
            var theme = localStorage.getItem('daisy-theme');
            if (!theme && window.matchMedia('(prefers-color-scheme: light)').matches) {
                theme = 'light';
            }
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <!--head-tags-->
</head>
<body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/@ssg/client.tsx"></script>
</body>
</html>
